<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Background -->
  <rect width="480" height="320" fill="#fdf2f8"/>
  <!-- Nav -->
  <rect width="480" height="44" fill="#fff"/>
  <rect y="44" width="480" height="1" fill="#fce7f3"/>
  <!-- Logo -->
  <text x="24" y="27" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#9d174d">Léa Beauté</text>
  <!-- Nav dots (decorative) -->
  <circle cx="105" cy="22" r="2" fill="#f9a8d4"/>
  <!-- Nav links -->
  <text x="240" y="27" font-family="Arial,sans-serif" font-size="11" fill="#9d174d">Soins</text>
  <text x="288" y="27" font-family="Arial,sans-serif" font-size="11" fill="#9d174d">Épilation</text>
  <text x="344" y="27" font-family="Arial,sans-serif" font-size="11" fill="#9d174d">Tarifs</text>
  <text x="392" y="27" font-family="Arial,sans-serif" font-size="11" fill="#9d174d">Contact</text>
  <!-- CTA btn -->
  <rect x="424" y="12" width="44" height="22" rx="11" fill="#db2777"/>
  <text x="446" y="27" font-family="Arial,sans-serif" font-weight="600" font-size="10" fill="#fff" text-anchor="middle">RDV</text>

  <!-- Hero section - split layout -->
  <rect y="45" width="480" height="165" fill="#fff"/>
  <!-- Left content -->
  <text x="28" y="85" font-family="Georgia,serif" font-style="italic" font-size="11" fill="#db2777">Institut de beauté à Paris</text>
  <text x="28" y="110" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#1e293b">Prenez soin</text>
  <text x="28" y="134" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#db2777">de vous</text>
  <text x="28" y="157" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Soins du visage, épilation, massage.</text>
  <text x="28" y="172" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Sur RDV du lundi au samedi.</text>
  <!-- CTA -->
  <rect x="28" y="183" width="130" height="22" rx="11" fill="#db2777"/>
  <text x="93" y="198" font-family="Arial,sans-serif" font-weight="600" font-size="11" fill="#fff" text-anchor="middle">Prendre RDV en ligne</text>

  <!-- Right - elegant image placeholder -->
  <rect x="260" y="50" width="200" height="155" rx="8" fill="#fce7f3"/>
  <!-- Decorative flowers -->
  <circle cx="360" cy="127" r="50" fill="#fbcfe8" opacity="0.5"/>
  <circle cx="330" cy="97" r="30" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="390" cy="155" r="25" fill="#f472b6" opacity="0.25"/>
  <!-- Face silhouette simplified -->
  <ellipse cx="360" cy="120" rx="38" ry="48" fill="#fda4af" opacity="0.3"/>
  <text x="360" y="132" font-family="Arial,sans-serif" font-size="40" text-anchor="middle" opacity="0.4">💆</text>
  <!-- Floating tag -->
  <rect x="270" y="55" width="90" height="24" rx="12" fill="#fff" stroke="#fce7f3" stroke-width="1"/>
  <circle cx="284" cy="67" r="8" fill="#dcfce7"/>
  <text x="284" y="72" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#16a34a">★</text>
  <text x="315" y="71" font-family="Arial,sans-serif" font-size="10" fill="#1e293b">5/5 Google</text>

  <!-- Services strip -->
  <rect y="210" width="480" height="110" fill="#fdf2f8"/>
  <text x="240" y="232" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#9d174d" text-anchor="middle">Nos soins phares</text>

  <!-- Service pills -->
  <rect x="18" y="242" width="88" height="28" rx="14" fill="#fff" stroke="#fce7f3" stroke-width="1.5"/>
  <text x="62" y="261" font-family="Arial,sans-serif" font-size="11" fill="#db2777" text-anchor="middle">✨ Soin visage</text>

  <rect x="116" y="242" width="80" height="28" rx="14" fill="#fff" stroke="#fce7f3" stroke-width="1.5"/>
  <text x="156" y="261" font-family="Arial,sans-serif" font-size="11" fill="#db2777" text-anchor="middle">🌸 Épilation</text>

  <rect x="206" y="242" width="80" height="28" rx="14" fill="#fff" stroke="#fce7f3" stroke-width="1.5"/>
  <text x="246" y="261" font-family="Arial,sans-serif" font-size="11" fill="#db2777" text-anchor="middle">💅 Manucure</text>

  <rect x="296" y="242" width="80" height="28" rx="14" fill="#fff" stroke="#fce7f3" stroke-width="1.5"/>
  <text x="336" y="261" font-family="Arial,sans-serif" font-size="11" fill="#db2777" text-anchor="middle">🧖 Massage</text>

  <rect x="386" y="242" width="76" height="28" rx="14" fill="#db2777"/>
  <text x="424" y="261" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Voir tarifs</text>

  <!-- Trust -->
  <text x="240" y="295" font-family="Arial,sans-serif" font-size="11" fill="#9d174d" text-anchor="middle">📍 75 Rue de la Paix, Paris 2e — Ouvert Lun–Sam 9h–19h</text>
</svg>
