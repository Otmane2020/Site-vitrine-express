  <!-- Card 1 -->
  <rect x="20" y="238" width="130" height="68" rx="8" fill="#f0f6ff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="48" cy="260" r="14" fill="#dbeafe"/>
  <text x="48" y="265" font-family="Arial,sans-serif" font-size="16" fill="#1d4ed8" text-anchor="middle">🔧</text>
  <text x="75" y="260" font-family="Arial,sans-serif" font-weight="600" font-size="11" fill="#1e293b">Dépannage</text>
  <text x="75" y="274" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Urgence 24h/24</text>
  <text x="75" y="288" font-family="Arial,sans-serif" font-size="10" fill="#64748b">7j/7</text>

  <!-- Card 2 -->
  <rect x="165" y="238" width="130" height="68" rx="8" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="193" cy="260" r="14" fill="#e0f2fe"/>
  <text x="193" y="265" font-family="Arial,sans-serif" font-size="16" fill="#0369a1" text-anchor="middle">🚿</text>
  <text x="220" y="260" font-family="Arial,sans-serif" font-weight="600" font-size="11" fill="#1e293b">Salle de bain</text>
  <text x="220" y="274" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Installation</text>
  <text x="220" y="288" font-family="Arial,sans-serif" font-size="10" fill="#64748b">& rénovation</text>

  <!-- Card 3 -->
  <rect x="310" y="238" width="150" height="68" rx="8" fill="#f0fdf4" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="338" cy="260" r="14" fill="#dcfce7"/>
  <text x="338" y="265" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle">⭐</text>
  <text x="365" y="256" font-family="Arial,sans-serif" font-weight="600" font-size="11" fill="#1e293b">4.9/5 — 148 avis</text>
  <text x="365" y="270" font-family="Arial,sans-serif" font-size="10" fill="#64748b">★★★★★</text>
  <text x="365" y="286" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" font-weight="600">Certifié RGE</text>
