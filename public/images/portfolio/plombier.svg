  <rect y="45" width="480" height="160" fill="url(#h1)" opacity="0.6"/>
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="1"/>
      <stop offset="55%" stop-color="#1e3a5f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Pipe icon illustration -->
  <rect x="300" y="65" width="160" height="120" rx="4" fill="rgba(30,58,95,0)" opacity="0.3"/>
  <!-- Simple pipe illustration -->
  <rect x="310" y="90" width="140" height="18" rx="9" fill="#60a5fa" opacity="0.7"/>
  <rect x="350" y="64" width="18" height="70" rx="9" fill="#60a5fa" opacity="0.5"/>
  <rect x="408" y="64" width="18" height="70" rx="9" fill="#60a5fa" opacity="0.5"/>
  <circle cx="350" cy="64" r="10" fill="#93c5fd" opacity="0.6"/>
  <circle cx="426" cy="64" r="10" fill="#93c5fd" opacity="0.6"/>
  <rect x="310" y="140" width="140" height="14" rx="7" fill="#3b82f6" opacity="0.4"/>

  <!-- Hero text -->
  <text x="28" y="86" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#fff">Plombier à Lyon</text>
  <text x="28" y="106" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#60a5fa">Intervention rapide</text>
  <text x="28" y="130" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Dépannage urgence 7j/7 — Devis gratuit</text>
  <text x="28" y="146" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Intervention sous 2h dans tout Lyon</text>
