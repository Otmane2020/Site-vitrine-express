  <rect width="480" height="44" fill="#fff"/>
  <rect y="44" width="480" height="1" fill="#e2e8f0"/>
  <!-- Logo -->
  <circle cx="28" cy="22" r="12" fill="#1d4ed8"/>
  <text x="46" y="27" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#1e293b">Fontaine Plomberie</text>
  <!-- Nav links -->
  <text x="260" y="27" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Services</text>
