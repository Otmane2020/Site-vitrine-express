  <text x="88" y="179" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#fff" text-anchor="middle">Appel urgence</text>
  <rect x="160" y="158" width="100" height="32" rx="6" fill="transparent" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="210" y="179" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Devis gratuit</text>

