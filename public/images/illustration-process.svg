<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ipg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ipg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="360" rx="220" ry="18" fill="#000000" opacity="0.25"/>

  <!-- ordinateur portable -->
  <g transform="translate(150,90)">
    <rect x="0" y="0" width="300" height="190" rx="14" fill="#1e1b2e"/>
    <rect x="10" y="10" width="280" height="170" rx="6" fill="#0a0a0f"/>
    <!-- écran : maquette de site -->
    <rect x="24" y="24" width="252" height="20" rx="4" fill="url(#ipg1)"/>
    <rect x="24" y="54" width="180" height="12" rx="4" fill="rgba(255,255,255,0.85)"/>
    <rect x="24" y="72" width="130" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="24" y="92" width="90" height="20" rx="10" fill="url(#ipg2)"/>
    <rect x="24" y="126" width="76" height="54" rx="8" fill="rgba(255,255,255,0.10)"/>
    <rect x="112" y="126" width="76" height="54" rx="8" fill="rgba(255,255,255,0.10)"/>
    <rect x="200" y="126" width="76" height="54" rx="8" fill="rgba(255,255,255,0.10)"/>
    <!-- base du portable -->
    <path d="M-20 190 L320 190 L300 210 L0 210 Z" fill="#2a2438"/>
  </g>

  <!-- icone curseur cliquant sur le bouton -->
  <g transform="translate(300,205)">
    <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#ffffff" stroke="#0a0a0f" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- étincelles de "création" -->
  <g fill="#fbbf24">
    <circle cx="120" cy="70" r="5"/>
    <circle cx="470" cy="120" r="4"/>
    <circle cx="480" cy="230" r="6"/>
    <circle cx="100" cy="260" r="4"/>
  </g>

  <!-- coeur / satisfaction flottant -->
  <g transform="translate(430,60)">
    <rect x="0" y="0" width="86" height="86" rx="20" fill="#ffffff"/>
    <path d="M43 62 C20 46 24 26 40 26 C43 26 43 30 43 30 C43 30 43 26 46 26 C62 26 66 46 43 62 Z" fill="#ec4899"/>
  </g>
</svg>
