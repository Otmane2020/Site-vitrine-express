<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="wfyMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>

  <rect width="160" height="160" rx="40" fill="url(#wfyBg)"/>
  <rect x="4" y="4" width="152" height="152" rx="36" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <!-- Monogramme W stylisé en un seul trait continu, avec le sommet central relevé en pointe "éclair" -->
  <path d="M38 56
           L54 108
           L80 68
           L106 108
           L122 56"
        fill="none" stroke="url(#wfyMark)" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- point lumineux au sommet du W : symbolise la vitesse / le "48h" -->
  <circle cx="80" cy="68" r="7" fill="#fbbf24"/>
</svg>
