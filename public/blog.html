<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Webify — Guides et tendances pour entrepreneur en 2024</title>
  <meta name="description" content="Guides, conseils et tendances pour créer votre site vitrine en tant qu'auto-entrepreneur, avocat, médecin ou artisan. Lisez nos articles SEO." />
  <meta name="keywords" content="blog site vitrine, guide auto-entrepreneur, site web pas cher, création site vitrine" />
  <link rel="canonical" href="https://webify-app.com/blog" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Blog Webify — Guides pour entrepreneurs" />
  <meta property="og:description" content="Découvrez comment créer votre site vitrine en 48h. Guides complets pour auto-entrepreneurs, avocats, médecins, artisans." />
  <meta property="og:url" content="https://webify-app.com/blog" />
  <meta property="og:locale" content="fr_FR" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; line-height: 1.6; color: #1a1a1a; background: #fafafa; }

    /* Navigation */
    .nav { background: white; border-bottom: 1px solid #e5e5e5; padding: 1rem 2rem; }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; text-decoration: none; color: #1a1a1a; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { text-decoration: none; color: #666; transition: color 0.2s; }
    .nav-links a:hover { color: #1a1a1a; }
    .nav-cta { background: #0066ff; color: white; padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; transition: background 0.2s; }
    .nav-cta:hover { background: #0052cc; }

    /* Header */
    .blog-header { background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%); color: white; padding: 4rem 2rem; text-align: center; }
    .blog-header h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .blog-header p { font-size: 1.1rem; opacity: 0.95; }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* Articles Grid */
    .articles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem; }
    .article-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; }
    .article-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .article-card-image { width: 100%; height: 180px; background: linear-gradient(135deg, #0066ff, #00d4ff); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; }
    .article-card-content { padding: 1.5rem; }
    .article-category { display: inline-block; background: #e3f2fd; color: #0066ff; padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 0.5rem; }
    .article-card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #1a1a1a; }
    .article-card p { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem; }
    .article-meta { display: flex; gap: 1rem; font-size: 0.85rem; color: #999; }

    /* Single Article */
    .blog-article { max-width: 800px; margin: 0 auto; background: white; padding: 3rem; border-radius: 8px; }
    .blog-article h1 { font-size: 2rem; margin-bottom: 1rem; color: #1a1a1a; }
    .intro { font-size: 1.1rem; color: #666; font-weight: 500; margin-bottom: 2rem; }
    .blog-article h2 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 1rem; color: #1a1a1a; }
    .blog-article p { margin-bottom: 1rem; color: #555; }
    .blog-article ul, .blog-article ol { margin-left: 2rem; margin-bottom: 1rem; }
    .blog-article li { margin-bottom: 0.5rem; }
    .cta-link { color: #0066ff; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .cta-link:hover { color: #0052cc; }

    /* Footer */
    .footer { background: #1a1a1a; color: white; padding: 2rem; text-align: center; margin-top: 4rem; }

    /* Mobile */
    @media (max-width: 768px) {
      .nav-inner { flex-direction: column; gap: 1rem; }
      .nav-links { flex-direction: column; gap: 1rem; font-size: 0.9rem; }
      .blog-header h1 { font-size: 1.8rem; }
      .blog-header { padding: 2rem 1rem; }
      .container { padding: 1rem; }
      .blog-article { padding: 1.5rem; }
      .articles-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">🚀 Webify</a>
    <div class="nav-links">
      <a href="/">Accueil</a>
      <a href="/blog">Blog</a>
      <a href="/commander.html">Démarrer</a>
    </div>
    <a href="/commander.html" class="nav-cta">0€ aujourd'hui</a>
  </div>
</nav>

<!-- Header -->
<div class="blog-header">
  <div class="container">
    <h1>Le Blog Webify</h1>
    <p>Guides, conseils et tendances pour créer votre site vitrine en 2024</p>
  </div>
</div>

<!-- Articles -->
<div class="container">
  <div class="articles-grid" id="articles-list">
    <p style="grid-column: 1 / -1; text-align: center; color: #999;">Chargement des articles...</p>
  </div>
</div>

<!-- Footer -->
<footer class="footer">
  <p>© 2024 Webify — Création de site vitrine express en 48h</p>
</footer>

<script>
  // Charger les articles
  async function loadArticles() {
    try {
      const res = await fetch('/api/blog');
      const articles = await res.json();

      const container = document.getElementById('articles-list');
      container.innerHTML = articles.map(article => `
        <a href="/blog/${article.slug}" class="article-card">
          <div class="article-card-image">${article.title.substring(0, 3)}</div>
          <div class="article-card-content">
            <span class="article-category">${article.category}</span>
            <h3>${article.title}</h3>
            <p>${article.description}</p>
            <div class="article-meta">
              <span>${article.date}</span>
              <span>${article.readTime}</span>
            </div>
          </div>
        </a>
      `).join('');
    } catch (err) {
      console.error('Erreur chargement articles:', err);
    }
  }

  // Charger et afficher un article spécifique
  async function loadArticle(slug) {
    try {
      const res = await fetch(`/api/blog/${slug}`);
      if (!res.ok) {
        document.body.innerHTML = '<p style="padding: 2rem; text-align: center;">Article non trouvé</p>';
        return;
      }
      const article = await res.json();

      // Remplacer le contenu
      const container = document.querySelector('.container');
      container.innerHTML = article.content;

      // Mettre à jour le titre
      document.title = article.title + ' — Webify Blog';
    } catch (err) {
      console.error('Erreur:', err);
    }
  }

  // Déterminer si on affiche la liste ou un article
  const path = window.location.pathname;
  if (path.includes('/blog/') && path !== '/blog') {
    const slug = path.split('/').pop();
    loadArticle(slug);
  } else {
    loadArticles();
  }
</script>

</body>
</html>
